[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-lib"
version = "0.1.0"
description = "Python library and GUI for the Notion API"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0",
    "requests>=2.31.0",
    "certifi>=2024.0.0",
]

[project.scripts]
notion-gui = "notion_lib.notion_gui:main"

[tool.setuptools.packages.find]
where = ["src"]